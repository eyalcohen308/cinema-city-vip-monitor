name: Check Cinema City VIP

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Date to check: YYYY-MM-DD, a weekday name, today, or tomorrow"
        required: false
        default: "thursday"
      movie_query:
        description: "Comma-separated movie title aliases"
        required: false
        default: "Spider-Man,Spiderman,ספיידרמן"
  schedule:
    # Twice an hour during waking hours only. Cron is always UTC; Israel is
    # UTC+3 in summer, so 05-18 UTC == 08:00 .. 21:00 local, and nothing fires
    # between 22:00 and 08:00.
    #
    # :23 and :53 on purpose. Cron minutes cluster hard on :00, then :30, then
    # :15/:45, because that is what people type; GitHub queues each spike at
    # once and drops what it cannot drain. Asking at :00 cost this repo whole
    # slots and 7-80 minute delays. :23 and :53 sit in the two widest gaps
    # between those spikes, and :53 gets queued ahead of the :00 flood rather
    # than behind it. Scheduled runs are best-effort regardless, which is why
    # the status panel calls the next check "planned" rather than promising it.
    - cron: "23,53 5-18 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: cinema-city-vip-monitor
  # Never cancel a scheduled check: a manual run that lands on top of one
  # would otherwise kill it, and a killed run notifies about nothing.
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_DATE: ${{ inputs.target_date || 'thursday' }}
      MOVIE_QUERY: ${{ inputs.movie_query || 'Spider-Man,Spiderman,ספיידרמן' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python check_vip.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinema-city-check-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Notify when tickets appear
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          status=$(jq -r .status artifacts/result.json)
          resolved_date=$(jq -r .target_date artifacts/result.json)
          title="🎬 נפתחו כרטיסי VIP בסינמה סיטי גלילות — ${resolved_date}"

          if [[ "$status" != "available" ]]; then
            echo "Status is '$status' for ${resolved_date} — nothing to announce."
            exit 0
          fi

          # The issue doubles as the "already told you" marker, so Telegram
          # fires exactly once per date instead of every hour after opening.
          # Match locally on the ISO date rather than via `--search`: GitHub's
          # search tokenizer is unreliable for Hebrew titles, and a missed
          # match here would mean a duplicate issue and an hourly Telegram.
          existing=$(gh issue list --state all --limit 200 --json title \
            --jq "[.[] | select(.title | contains(\"${resolved_date}\"))] | length")
          if [[ "$existing" != "0" ]]; then
            echo "Already announced ${resolved_date}."
            exit 0
          fi

          gh issue create --title "$title" --body-file artifacts/result.md

          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "Telegram secrets not set — GitHub issue only."
            exit 0
          fi
          curl -sS --fail-with-body -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@artifacts/notify.txt" \
            --data "parse_mode=HTML" \
            --data "disable_web_page_preview=true" > /dev/null
          echo "Telegram message sent."

      - name: Refresh the pinned status message
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            exit 0
          fi
          api="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          # A bot's id is the part of its token before the colon, so knowing
          # "is the pinned message mine?" costs no extra API call.
          bot_id="${TELEGRAM_BOT_TOKEN%%:*}"

          # A button under the panel for "check now", because the schedule is
          # best-effort. It can only be a link: triggering the workflow needs
          # an authenticated API call, and a bot button cannot carry a token.
          workflow_url="${{ github.server_url }}/${{ github.repository }}/actions/workflows/check.yml"
          keyboard=$(jq -nc --arg url "$workflow_url" \
            '{inline_keyboard: [[{text: "🔄 בדיקה עכשיו", url: $url}]]}')

          # The pinned message *is* the state store. Nothing to persist between
          # runs, and if it ever gets unpinned or deleted the next run simply
          # posts and pins a fresh one.
          pinned=$(curl -sS "${api}/getChat" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            | jq -r --arg bot "$bot_id" \
              '(.result.pinned_message // empty)
                 | select(.from.id == ($bot | tonumber)) | .message_id')

          if [[ -n "$pinned" ]] && curl -sS "${api}/editMessageText" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data "message_id=${pinned}" \
              --data-urlencode "text@artifacts/status.txt" \
              --data "parse_mode=HTML" \
              --data "disable_web_page_preview=true" \
              --data-urlencode "reply_markup=${keyboard}" \
              | jq -e '.ok' > /dev/null; then
            echo "Pinned status message ${pinned} updated."
            exit 0
          fi

          message_id=$(curl -sS --fail-with-body "${api}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@artifacts/status.txt" \
            --data "parse_mode=HTML" \
            --data "disable_web_page_preview=true" \
            --data-urlencode "reply_markup=${keyboard}" \
            | jq -r '.result.message_id')
          # Silent: the status panel is for looking up, never for interrupting.
          curl -sS --fail-with-body "${api}/pinChatMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data "message_id=${message_id}" \
            --data "disable_notification=true" > /dev/null
          echo "Posted and pinned a new status message ${message_id}."

      - name: Tell me if the monitor itself broke
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            exit 0
          fi
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          text=$'⚠️ הניטור של כרטיסי ה-VIP נכשל — הבדיקה אינה פועלת כרגע.\n'"$run_url"
          curl -sS --fail-with-body -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" > /dev/null
